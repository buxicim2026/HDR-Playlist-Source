name: Build OBS plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  OBS_VERSION: "31.0.0"

jobs:
  win-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC toolchain (dumpbin/lib/cl)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache OBS SDK
        uses: actions/cache@v4
        with:
          path: build/plugin-sdk
          key: obs-sdk-win-${{ env.OBS_VERSION }}
      - name: Package
        shell: pwsh
        run: ./scripts/package-plugin.ps1 -ObsVersion $env:OBS_VERSION
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-win-x64
          path: release/*
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git pkg-config libasound2-dev libssl-dev
      - name: Cache OBS SDK
        uses: actions/cache@v4
        with:
          path: build/plugin-sdk
          key: obs-sdk-linux-${{ env.OBS_VERSION }}
      - name: Package
        run: OBS_VERSION=$OBS_VERSION bash scripts/package-plugin.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-linux-x64
          path: release/*
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache OBS SDK
        uses: actions/cache@v4
        with:
          path: build/plugin-sdk
          key: obs-sdk-macos-${{ env.OBS_VERSION }}
      - name: Package
        run: OBS_VERSION=$OBS_VERSION bash scripts/package-plugin.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-macos-arm64
          path: release/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [win-x64, linux-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
