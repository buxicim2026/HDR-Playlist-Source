AddFolder="添加文件夹…"
AddFolderHint="把文件夹内所有支持的视频/音频文件加入列表。"

PlaybackMode="播放模式"
ModeSequential="顺序播放"
ModeLoop="循环播放"
ModeShuffle="随机播放"

HardwareDecode="硬件解码"
HardwareDecodeHint="保留 10bit P010 HDR 帧不被降级。建议开启。"
Speed="播放速度"
SpeedHint="百分比（50-200）。100 = 正常。"

Transition="交叉淡化转场"
TransitionHint="片段间交叉淡化。HDR 画布使用 16F 中间缓冲保留高光；缓冲分辨率上限 1080p，转场结束立即释放，不会长期占用显存。"
TransitionDuration="转场时长（毫秒）"

LowMemory="低内存模式（推荐）"
LowMemoryHint="只创建一个解码器、不预载下一片段，内存与显存占用约减半（4K HDR 尤其明显）。关闭后才启用第二解码器实现无缝切换。"

MixedContent="HDR/SDR 混播策略"
MixedContentHint="仅当 OBS 输出被配置为 HDR（色彩格式 P010 + Rec.2100 PQ/HLG）时才使用 HDR 处理；否则一律按 SDR 播放（HDR 片源由 OBS 正常转 SDR）。"
AdaptToCanvas="自适应画布尺寸（推荐）"
AdaptToCanvasHint="以 OBS 基础画布分辨率输出并等比缩放视频，避免每帧额外的全分辨率缩放与色彩转换，可明显降低卡顿。"
Deinterlace="去隔行（隔行片源必开）"
DeinterlaceHint="带「2x」的选项每个场输出一帧：1080i25 会变成 50p、1080i30 变成 60p（需要 OBS 画布帧率 ≥ 该帧率，例如 60fps）。播放逐行素材请保持「关闭」，否则会白费性能。"
DeintOff="关闭（逐行片源）"
DeintYadif2x="Yadif 2x（隔行→50/60p，效果最好）"
DeintLinear2x="线性 2x（隔行→50/60p，更快）"
DeintBlend2x="混合 2x（隔行→50/60p，最省）"
DeintYadif="Yadif（隔行→原帧率）"
DeintLinear="线性混合（隔行→原帧率）"
DeintDiscard="丢弃一场（隔行→原帧率的一半）"
MixedAuto="自动：SDR 按 SDR 直出，HDR 按 HDR 直出（推荐）"
MixedForcePQ="强制全部按 HDR（Rec.2100 PQ）输出"
MixedForceHLG="强制全部按 HDR（Rec.2100 HLG）输出"
MixedForceSDR="强制全部按 SDR 输出"

Visibility="源隐藏时"
