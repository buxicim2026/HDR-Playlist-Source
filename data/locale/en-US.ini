PlaybackMode="Playback mode"
ModeSequential="Sequential"
ModeLoop="Loop playlist"
ModeShuffle="Shuffle"

HardwareDecode="Hardware decoding"
HardwareDecodeHint="Keeps 10-bit P010 HDR frames intact. Recommended on."
Speed="Playback speed"
SpeedHint="Percent (50-200). 100 = normal."

Transition="Crossfade"
TransitionHint="Crossfade between clips. On an HDR canvas a 16F intermediate keeps highlights intact; it is capped at 1080p and released as soon as the fade ends, so it never stays resident."
TransitionDuration="Crossfade duration (ms)"

LowMemory="Low-memory mode (recommended)"
LowMemoryHint="Runs a single decoder and never preloads the next clip, roughly halving memory/VRAM use (very noticeable with 4K HDR). Turn off to enable the second decoder for gapless switching."

MixedContent="Mixed HDR/SDR content"
MixedContentHint="HDR handling is only used when OBS is configured to output HDR (P010 + Rec.2100 PQ/HLG); otherwise everything plays as SDR (OBS tonemaps HDR clips normally)."
AdaptToCanvas="Adapt to canvas size (recommended)"
AdaptToCanvasHint="Outputs at the OBS base canvas resolution and aspect-fits the video, avoiding an extra full-resolution scale/colour pass every frame."
Deinterlace="Deinterlacing (required for interlaced sources)"
DeinterlaceHint="The \u201c2x\u201d modes emit one frame per field: 1080i25 becomes 50p and 1080i30 becomes 60p (the OBS canvas frame rate must be at least that, e.g. 60 fps). Keep Off for progressive media."
DeintOff="Off (progressive sources)"
DeintYadif2x="Yadif 2x (interlaced -> 50/60p, best)"
DeintLinear2x="Linear 2x (interlaced -> 50/60p, faster)"
DeintBlend2x="Blend 2x (interlaced -> 50/60p, cheapest)"
DeintYadif="Yadif (interlaced -> original rate)"
DeintLinear="Linear blend (interlaced -> original rate)"
DeintDiscard="Discard one field (interlaced -> half rate)"
MixedAuto="Auto: SDR plays as SDR, HDR plays as HDR (recommended)"
MixedForcePQ="Force everything to HDR (Rec. 2100 PQ)"
MixedForceHLG="Force everything to HDR (Rec. 2100 HLG)"
MixedForceSDR="Force everything to SDR"

